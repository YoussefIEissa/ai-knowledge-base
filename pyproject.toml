[project]
name = "ai-knowledge-base-fastapi-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Youssef Ibrahim", email = "youssefiibrahim2@gmail.com" }
]
requires-python = ">=3.13.15"
dependencies = [
    "docling>=2.137.0",
    "fastapi>=0.143.0",
    "huggingface-hub>=1.33.0",
    "llama-cpp-python>=0.3.36",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-knowledge-base-fastapi-rag = "ai_knowledge_base_fastapi_rag:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

# PyPI ships llama-cpp-python as source only. This index has prebuilt
# CPU wheels, so installing does not need a C++ compiler.
[[tool.uv.index]]
name = "llama-cpp-python-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-python-cpu" }
