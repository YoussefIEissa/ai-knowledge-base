[project]
name = "ai-knowledge-base-fastapi-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Youssef Ibrahim", email = "youssefiibrahim2@gmail.com" }
]
requires-python = ">=3.13.15"
dependencies = [
    "docling>=2.137.0",
    "fastapi>=0.143.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-knowledge-base-fastapi-rag = "ai_knowledge_base_fastapi_rag:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
